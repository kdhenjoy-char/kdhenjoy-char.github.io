<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 에이전트 포트폴리오</title>
<meta name="robots" content="noindex" />
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;background:#f6f8fa;color:#24292f}
main{text-align:center;padding:32px}
h1{margin:0 0 10px;font-size:18px}
p{margin:6px 0;font-size:14px;color:#57606a}
a{color:#0969da}
.err{color:#cf222e}
</style>
</head>
<body>
<main>
<h1 id="msg">AI 에이전트 포트폴리오로 이동합니다…</h1>
<p id="sub">잠시만 기다려 주세요.</p>
</main>
<script>
(function () {
  // ?t= 를 붙이고 no-store 로 요청해야 브라우저·CDN 캐시를 지나 항상 최신 주소를 받는다.
  fetch("url.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (d) {
      if (!d || !d.url) throw new Error("주소가 비어 있습니다");
      var a = document.createElement("a");
      a.href = d.url;
      a.textContent = "자동으로 넘어가지 않으면 여기를 눌러 주세요";
      var sub = document.getElementById("sub");
      sub.textContent = "";
      sub.appendChild(a);
      location.replace(d.url);
    })
    .catch(function (e) {
      document.getElementById("msg").textContent = "현재 주소를 불러오지 못했습니다";
      var sub = document.getElementById("sub");
      sub.className = "err";
      sub.textContent = "포털이 꺼져 있거나 아직 갱신되지 않았을 수 있습니다. (" + e.message + ")";
    });
})();
</script>
</body>
</html>
